plugins { id 'com.android.application' }

android {
    namespace 'com.leowood2000.miui.google.search'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leowood2000.miui.google.search'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    compileOnly files('libs/xposed-api-82.jar')
}
